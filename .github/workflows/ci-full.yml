name: Module subscriptions - Full regression
on:
  workflow_dispatch:
  # Full 21-job verification is mandatory for security-critical Phase 4 paths.
  # Keep the nine-job standard PR CI for all unrelated changes.
  pull_request:
    paths:
      - 'class/mail.class.php'
      - 'class/invoicepdf.class.php'
      - 'class/filebookingcheckpoint.class.php'
      - 'lib/booking.lib.php'
      - 'lib/booking_renderer.lib.php'
      - 'test/unit/cf05-finance.php'
      - 'test/unit/cf05-core-parity.php'
      - 'test/unit/maildelivery.php'
      - 'test/unit/postcommit.php'
      - 'test/unit/invoicepdf.php'
      - '.github/workflows/ci-full.yml'
      - 'class/booking.class.php'
      - 'docs/cf05-06-standard-core-source-qualification.md'
      - 'docs/cf05-06-standard-core-qualification-plan.md'
      - 'docs/adr/ADR-0001-core-first-transaction-profiles.md'
      - 'docs/adr/ADR-0001-risk-register.md'
      - 'docs/current-development-baseline.md'
      - 'docs/owner-core-parity-2026-11-22.md'
      - 'docs/cf05-core-parity-regression.md'
      - 'class/actions_membersubscriptionmassaction.class.php'
      - 'lib/membersubscriptionmassaction.lib.php'
      - 'admin/setup.php'
      - 'langs/de_DE/membersubscriptionmassaction.lang'
      - 'langs/en_US/membersubscriptionmassaction.lang'
      - 'class/period.class.php'
      - 'lib/preview_renderer.lib.php'
      # Forward-safe: any new class, library or admin PHP can affect financial
      # admission, confirmation, CSRF, amounts or post-COMMIT effects.
      - 'class/**'
      - 'lib/**'
      - 'admin/**'
      - 'subscription.php'
      - 'class/coreguardedrightsdb.class.php'
      - 'class/corecompatibility.class.php'
      - 'class/invoiceprofile.class.php'
      - 'lib/preview.lib.php'
      - 'lib/batch.lib.php'
      - 'test/unit/preview.php'
      - 'test/unit/request.php'
      - 'test/unit/controller-runtime.php'
      - 'test/unit/f29-rights.php'
      - 'test/unit/f29-book-flow.php'
      - 'test/unit/userreload.php'
      - 'test/unit/database.php'
      - 'class/invoice.class.php'
      - 'class/coreguardedtransaction.class.php'
      - 'class/transactionprofile.class.php'
      - 'class/preview.class.php'
      - 'class/databasestate.class.php'
      - 'class/activetransactionguard.class.php'
      - 'class/bookingmember.class.php'
      - 'lib/profile.lib.php'
      - 'test/unit/coreguarded-session.php'
      - 'test/unit/terminal.php'
      - 'test/unit/profile.php'
      - 'test/unit/booking.php'
      - 'test/unit/invoice.php'
      - 'test/unit/invoiceprofile.php'
      - 'test/unit/ci-triggers.php'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cf03-php83-hosted.yml'
permissions:
  contents: read
jobs:
  checks:
    name: Full PHP ${{ matrix.php }} / Dolibarr ${{ matrix.core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            core: '22.0.0'
            core-ref: 49b9a6d19f3deb6d410c0e9b3310e95be4ea7710
          - php: '8.2'
            core: '22.0.0'
            core-ref: 49b9a6d19f3deb6d410c0e9b3310e95be4ea7710
          - php: '7.4'
            core: '22.0.1'
            core-ref: dc00877d940da8326216e51263a85b0a4a418f22
          - php: '8.2'
            core: '22.0.1'
            core-ref: dc00877d940da8326216e51263a85b0a4a418f22
          - php: '7.4'
            core: '22.0.2'
            core-ref: f70b6b43ecfcebc69264bc008aafcb9b9de2b23c
          - php: '8.2'
            core: '22.0.2'
            core-ref: f70b6b43ecfcebc69264bc008aafcb9b9de2b23c
          - php: '7.4'
            core: '22.0.3'
            core-ref: e57703a6b69ad6da5876692d73defd7e754bb5c6
          - php: '8.2'
            core: '22.0.3'
            core-ref: e57703a6b69ad6da5876692d73defd7e754bb5c6
          - php: '7.4'
            core: '22.0.4'
            core-ref: 4f6e636e7e2aea1abde2c2b6f6ac4ffd34429f7f
          - php: '8.2'
            core: '22.0.4'
            core-ref: 4f6e636e7e2aea1abde2c2b6f6ac4ffd34429f7f
          - php: '7.4'
            core: '22.0.5'
            core-ref: 88ad132763be45e9620128c1830e41493e1cdd05
          - php: '8.2'
            core: '22.0.5'
            core-ref: 88ad132763be45e9620128c1830e41493e1cdd05
          - php: '8.2'
            core: '23.0.0'
            core-ref: 57a1f05d490a7a80944a8232e9c613e6556d2704
          - php: '8.2'
            core: '23.0.1'
            core-ref: b9f5895c68a9707e5b5616ef279bd7fe83760de6
          - php: '8.2'
            core: '23.0.2'
            core-ref: ccef1102e6850b7545be7bad91cf0cc4c74ac6ea
          - php: '8.2'
            core: '23.0.3'
            core-ref: 57d0be7dc97140d7d47e826875ba9256ec3b6357
          - php: '8.2'
            core: '23.0.4'
            core-ref: cb82037066c1c71f7c867482e9e92975222dfc14
          - php: '8.2'
            core: '24.0.0'
            core-ref: 769c7db907099643558e77d7002c109cfda919e5
          - php: '8.2'
            core: '24.0.1'
            core-ref: b7958385f00a92219f76a4dfea67dae93df97a25
          - php: '8.2'
            core: '24.0.2'
            core-ref: 7e927764767343334aaa067ca5ec054cfea0a26b
          - php: '8.2'
            core: '24.0.3'
            core-ref: 5c6c7ff6a5112413b1c27221c8d11750afad56f8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Whitespace (PR merge diff or pushed commit)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff HEAD^1 HEAD --check
          else
            git diff-tree --check --root -m -r HEAD
          fi
      - name: Unit contracts and structure
        run: |
          php test/unit/run.php
          php test/unit/database.php
          php test/unit/coreguarded.php
          php test/unit/f29-rights.php
          php test/unit/cf02-contribution-witness.php
          php test/unit/cf03-lab.php
          php test/unit/cf03-reader.php
          php test/unit/cf03-runbook.php
          php test/unit/cf03-evidence.php
          php test/unit/cf03-source.php
          php test/unit/coreguarded-session.php
          php test/unit/ci-triggers.php
          node test/unit/loading.js
      - uses: actions/checkout@v4
        with:
          repository: Dolibarr/dolibarr
          ref: ${{ matrix.core-ref }}
          path: .test-core
          persist-credentials: false
      - name: Synthetic contracts against Dolibarr ${{ matrix.core }} APIs
        env:
          DOLIBARR_TEST_ROOT: ${{ github.workspace }}/.test-core
          DOLIBARR_TEST_VERSION: ${{ matrix.core }}
        run: |
          php test/unit/booking.php
          php test/unit/f29-book-flow.php
          php test/unit/maildelivery.php
          php test/unit/invoiceprofile.php
          php test/unit/cf05-core-parity.php
          php test/unit/invoice.php
          php test/unit/cf05-finance.php
          php test/unit/invoicepdf.php
          php test/unit/postcommit.php
          php test/unit/userreload.php
          php test/unit/request.php
