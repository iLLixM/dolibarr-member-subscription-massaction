name: CF-03 hosted PHP 8.3 / Dolibarr 22.0.5
on:
  pull_request:
    paths:
      - 'tools/cf03-*'
      - 'test/unit/cf03-*'
      - '.github/workflows/cf03-php83-hosted.yml'
      - 'class/booking.class.php'
      - 'class/actions_membersubscriptionmassaction.class.php'
      - 'lib/membersubscriptionmassaction.lib.php'
      - 'admin/setup.php'
      - 'class/period.class.php'
      - 'lib/preview_renderer.lib.php'
      # Forward-safe: any new class, library or admin PHP can affect financial
      # admission, confirmation, CSRF, amounts or post-COMMIT effects.
      - 'class/**'
      - 'lib/**'
      - 'admin/**'
      - 'subscription.php'
      - 'class/coreguardedrightsdb.class.php'
      - 'class/corecompatibility.class.php'
      - 'class/invoiceprofile.class.php'
      - 'lib/preview.lib.php'
      - 'lib/batch.lib.php'
      - 'test/unit/preview.php'
      - 'test/unit/request.php'
      - 'test/unit/controller-runtime.php'
      - 'test/unit/f29-rights.php'
      - 'test/unit/f29-book-flow.php'
      - 'test/unit/userreload.php'
      - 'test/unit/database.php'
      - 'class/invoice.class.php'
      - 'class/coreguardedtransaction.class.php'
      - 'class/transactionprofile.class.php'
      - 'class/preview.class.php'
      - 'class/databasestate.class.php'
      - 'class/activetransactionguard.class.php'
      - 'class/bookingmember.class.php'
      - 'lib/profile.lib.php'
      - 'test/unit/coreguarded-session.php'
      - 'test/unit/terminal.php'
      - 'test/unit/profile.php'
      - 'test/unit/booking.php'
      - 'test/unit/invoice.php'
      - 'test/unit/invoiceprofile.php'
      - 'test/unit/ci-triggers.php'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-full.yml'
      - '.github/workflows/cf03-php83-hosted.yml'
      # Preserve the original hosted CF03 lane and exercise Phase-4
      # post-commit/PDF/mail boundaries on security-relevant PRs.
      - 'class/mail.class.php'
      - 'class/invoicepdf.class.php'
      - 'class/filebookingcheckpoint.class.php'
      - 'lib/booking.lib.php'
      - 'lib/booking_renderer.lib.php'
      - 'test/unit/cf05-finance.php'
      - 'test/unit/cf05-core-qualification.php'
      - 'test/unit/maildelivery.php'
      - 'test/unit/invoicepdf.php'
      - 'test/unit/postcommit.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-php83:
    name: PHP 8.3 / Dolibarr 22.0.5 - targeted CF03
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: CF-03 source syntax
        run: |
          php -l tools/cf03-lab.php
          php -l tools/cf03-lab.lib.php
          php -l tools/cf03-evidence.lib.php
          php -l test/unit/cf03-lab.php
          php -l test/unit/cf03-reader.php
          php -l test/unit/cf03-runbook.php
          php -l test/unit/cf03-evidence.php
          php -l tools/cf03-source.lib.php
          php -l test/unit/cf03-source.php
      - name: Offline CF-03 contracts
        run: |
          php test/unit/cf03-lab.php
          php test/unit/cf03-reader.php
          php test/unit/cf03-runbook.php
          php test/unit/cf03-evidence.php
          php test/unit/cf03-source.php
      - uses: actions/checkout@v4
        with:
          repository: Dolibarr/dolibarr
          ref: 88ad132763be45e9620128c1830e41493e1cdd05
          path: .test-core
          persist-credentials: false
      - name: PHP 8.3/V22.0.5 business synthetic spot checks
        env:
          DOLIBARR_TEST_ROOT: ${{ github.workspace }}/.test-core
          DOLIBARR_TEST_VERSION: '22.0.5'
        run: |
          php test/unit/coreguarded.php
          php test/unit/f29-rights.php
          php test/unit/booking.php
          php test/unit/f29-book-flow.php
          php test/unit/invoiceprofile.php
          php test/unit/cf05-core-qualification.php
          php test/unit/invoice.php
          php test/unit/cf05-finance.php
          php test/unit/ci-triggers.php
          php test/unit/maildelivery.php
          php test/unit/invoicepdf.php
          php test/unit/postcommit.php
          php test/unit/request.php
